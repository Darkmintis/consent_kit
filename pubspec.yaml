name: consent_kit
description: >-
  Google UMP for Flutter AdMob in three lines. Bootstrap consent, AdGate,
  privacy-options button, debug-safe. Android, iOS; web/desktop no-op.
version: 1.0.0
homepage: https://github.com/darkmintis/consent_kit
repository: https://github.com/darkmintis/consent_kit
issue_tracker: https://github.com/darkmintis/consent_kit/issues
documentation: https://github.com/darkmintis/consent_kit#readme
topics:
  - consent
  - gdpr
  - ump
  - ads
  - privacy

environment:
  sdk: ">=3.4.0 <4.0.0"
  flutter: ">=3.22.0"

dependencies:
  flutter:
    sdk: flutter
  google_mobile_ads: ">=5.0.0 <10.0.0"

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
